apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codeduels-external-secrets
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: codeduels-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: /codeduels/prod/db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: /codeduels/prod/db_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: /codeduels/prod/jwt_secret
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: /codeduels/prod/google_client_id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: /codeduels/prod/google_client_secret
    - secretKey: JUDGE0_API_KEY
      remoteRef:
        key: /codeduels/prod/judge0_api_key
    - secretKey: ADMIN_DEFAULT_EMAIL
      remoteRef:
        key: /codeduels/prod/admin_email
    - secretKey: ADMIN_DEFAULT_PASSWORD
      remoteRef:
        key: /codeduels/prod/admin_password
    - secretKey: LAMBDA_INTERNAL_SECRET
      remoteRef:
        key: /codeduels/prod/lambda_secret---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
